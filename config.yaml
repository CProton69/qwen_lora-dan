config:
  meta:
    name: qwen_lora_1758983219
    version: '1.0'
  name: qwen_lora_1758983219
  process:
  - datasets:
    - cache_latents_to_disk: false
      caption_dropout_rate: 0.0
      caption_ext: txt
      default_caption: A photo of a person named dan
      folder_path: /src/input_images
      num_workers: 4
      pin_memory: true
      resolution:
      - 512
      - 768
      - 1024
      shuffle_tokens: false
    device: cuda:0
    model:
      arch: qwen_image
      low_vram: false
      name_or_path: Qwen/Qwen-Image
      quantize: false
      quantize_te: false
    network:
      linear: 128
      linear_alpha: 128
      type: lora
    sample:
      sample_every: 0
    save:
      dtype: float16
      max_step_saves_to_keep: 1
      push_to_hub: false
      save_every: 1200
    train:
      batch_size: 1
      dtype: bf16
      ema_config:
        ema_decay: 0.99
        use_ema: false
      gradient_accumulation_steps: 2
      gradient_checkpointing: false
      lr: 0.0002
      max_grad_norm: 1.0
      noise_scheduler: flowmatch
      optimizer: adamw
      seed: 42
      steps: 1200
      train_text_encoder: false
      train_unet: true
    training_folder: /src/output
    type: sd_trainer
job: extension
